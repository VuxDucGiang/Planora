services:

  db:
    container_name: planora-mysql
    image: mysql:8.0
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: planora_db
      MYSQL_USER: planora
      MYSQL_PASSWORD: planorapassword
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "planora", "-pplanorapassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: planora-backend
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/planora_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=planora
      - SPRING_DATASOURCE_PASSWORD=planorapassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_AIVEN_ENABLED=false
      - APP_JWT_SECRET=c3VwZXJfc2VjcmV0X2tleV9wbGFub3JhX3BsYXRmb3JtX2tleV8xMjM0NTY3ODkw
      - APP_JWT_EXPIRATION=86400000
    depends_on:
      db:
        condition: service_healthy
