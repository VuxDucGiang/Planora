spring:
  datasource:
    url: jdbc:mysql://localhost:3306/planora_db?createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: planora_secret_key_planora_secret_key_123456
    expiration: 86400000